name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        shell: bash
        run: python -m pytest -q --tb=short -rf 2>&1 | tee pytest.log
      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import re
          text = open("pytest.log", encoding="utf-8", errors="replace").read()
          tail = text[-6000:]
          # workflow commands need %, CR and LF escaped
          tail = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest output (last part)::{tail}")
          PY
