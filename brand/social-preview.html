<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:640px;background:#F3F5F8;overflow:hidden;font-family:"Source Serif 4",Georgia,serif}
.card{position:relative;width:1280px;height:640px;padding:72px 80px;box-sizing:border-box}
.logo{height:64px;display:block}
h1{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-weight:800;font-size:104px;line-height:1;letter-spacing:-0.035em;color:#101A33;margin:120px 0 22px}
p{font-size:32px;line-height:1.4;color:#26304D;margin:0;max-width:920px}
svg{position:absolute;right:-60px;top:-20px;width:640px}
.bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:#2447F5}
</style></head><body>
<div class="card">
<svg viewBox="0 0 500 600" fill="none" stroke="#C9D0E0" stroke-width="2"><circle cx="150" cy="300" r="200"/><circle cx="350" cy="300" r="200"/>
<line x1="150" y1="300" x2="350" y2="300" stroke="#9FB0E8" stroke-width="3"/><line x1="150" y1="300" x2="250" y2="126.8" stroke="#9FB0E8" stroke-width="3"/><line x1="350" y1="300" x2="250" y2="126.8" stroke="#9FB0E8" stroke-width="3"/>
<rect x="452" y="556" width="16" height="16" fill="#2447F5" stroke="none"/></svg>
<img class="logo" src="logo-horizontal.svg" alt="">
<h1>“Done” is<br>not proof.</h1>
<p>Checks that your AI agent really finished each requirement.</p>
<div class="bar"></div>
</div></body></html>
