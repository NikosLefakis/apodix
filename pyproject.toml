[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apodix"
version = "0.0.1"
description = "Checks that an AI agent's claim of 'done' is backed by tests that would notice if the code were wrong."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pytest>=7"]

[project.scripts]
apodix = "apodix.cli:main"

[project.entry-points.pytest11]
apodix = "apodix.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
